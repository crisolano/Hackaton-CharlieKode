{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-semibold mb-2">{{ project_name }}</h1>
<p class="text-slate-600 mb-6">Hackatón Campuslands — gestión de espacios, equipos e incidencias.</p>
<div class="grid gap-4 sm:grid-cols-3">
  {% for item in nav_items %}
  <a href="{{ item.href }}" class="block rounded-lg border border-slate-200 bg-white p-4 hover:border-indigo-400">
    {{ item.label }}
  </a>
  {% endfor %}
</div>
{% endblock %}
