<div id="reservas"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if reservas %}
  <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-100 text-left text-slate-600">
        <tr>
          <th class="px-4 py-2">Sala</th><th class="px-4 py-2">Inicio</th>
          <th class="px-4 py-2">Fin</th><th class="px-4 py-2">Asistentes</th>
          <th class="px-4 py-2">Responsable</th>
        </tr>
      </thead>
      <tbody>
        {% for r in reservas %}
        <tr class="border-t border-slate-100">
          <td class="px-4 py-2">{{ r.sala.nombre }}</td>
          <td class="px-4 py-2">{{ r.inicio|fecha_hora }}</td>
          <td class="px-4 py-2">{{ r.fin|fecha_hora }}</td>
          <td class="px-4 py-2">{{ r.asistentes }}</td>
          <td class="px-4 py-2">{{ r.responsable }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <p class="text-slate-500">Aún no hay reservas.</p>
  {% endif %}
</div>
