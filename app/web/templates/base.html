<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#24252b">
  <link rel="icon" type="image/png" href="{{ estatico('campuslands-casco.png') }}">
  <title>{% block title %}{{ project_name }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{{ estatico('app.css') }}">
  <link rel="stylesheet" href="{{ estatico('visual.css') }}">
  <script>
    /* Preferencia de movimiento guardada: se aplica antes de pintar para evitar parpadeos. */
    try { if (localStorage.getItem("movimiento") === "off") document.documentElement.dataset.movimiento = "off"; } catch (e) {}
  </script>
</head>
<body class="min-h-screen flex flex-col">
  <a href="#contenido" class="skip-link">Saltar al contenido</a>

  <header class="site-header">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-x-6 gap-y-2">
      <a href="/" class="brand">
        <img src="{{ estatico('campuslands-casco.png') }}" alt="Campuslands"
             class="brand-logo" width="45" height="36">
        <span class="brand-text text-sm sm:text-base">{{ project_name }}</span>
      </a>
      <nav aria-label="Secciones principales" class="flex flex-wrap gap-1">
        <a href="/" class="nav-link" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Inicio</a>
        {% for item in nav_items %}
        <a href="{{ item.href }}" class="nav-link"
           {% if request.url.path == item.href %}aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main id="contenido" class="max-w-5xl w-full mx-auto px-4 py-8 flex-1" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>Hackatón Campuslands · «El campus bajo presión» · MVP</span>
    <button type="button" id="btn-movimiento" class="btn-movimiento" aria-pressed="false"
            data-texto-pausar="Pausar animaciones" data-texto-reanudar="Reanudar animaciones">Pausar animaciones</button>
  </footer>
  <script src="{{ estatico('app.js') }}"></script>
  <script src="{{ estatico('scroll.js') }}"></script>
</body>
</html>
